<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partner Vault PoC</title>
<style>
  :root { --ink:#0f1b2d; --ink2:#1b2b44; --blue:#3b82f6; --green:#16a34a; --red:#dc2626; --amber:#d97706; --bg:#f2f4f9; --card:#fff; --line:#e5e9f0; --muted:#6b7a90; --text:#1c2733; --accent:var(--red); --accent-soft:#fdecec; }
  body.post { --accent:var(--green); --accent-soft:#e7f6ec; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); font-size:14px; }
  button { font-family:inherit; }
  .app { display:grid; grid-template-columns:236px 1fr; min-height:100vh; }
  @media (max-width:860px) { .app { grid-template-columns:1fr; } .side { position:static; height:auto; } }

  /* sidebar */
  .side { background:linear-gradient(180deg,var(--ink),#0b1424); color:#cbd5e3; position:sticky; top:0; height:100vh; padding:20px 14px; display:flex; flex-direction:column; }
  .logo { display:flex; align-items:center; gap:10px; color:#fff; font-weight:800; font-size:18px; padding:0 8px 22px; }
  .logo svg { width:26px; height:26px; stroke:#60a5fa; }
  .logo small { display:block; font-weight:500; font-size:10px; letter-spacing:.12em; color:#7f90a8; text-transform:uppercase; }
  .nav-item { display:flex; align-items:center; gap:12px; width:100%; background:none; border:0; color:inherit; padding:10px 12px; border-radius:10px; cursor:pointer; font-size:14px; text-align:left; transition:background .15s,color .15s; position:relative; }
  .nav-item svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  .nav-item:hover { background:rgba(255,255,255,.07); color:#fff; }
  .nav-item.active { background:rgba(96,165,250,.16); color:#fff; font-weight:600; }
  .nav-item .dot { width:8px; height:8px; border-radius:50%; background:var(--accent); margin-left:auto; box-shadow:0 0 0 3px rgba(255,255,255,.06); }
  .side .grow { flex:1; }
  .status-pill { background:rgba(255,255,255,.07); border-radius:12px; padding:12px; font-size:12px; }
  .status-pill b { display:block; color:#fff; font-size:13px; margin-bottom:2px; }
  .status-pill i { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--accent); margin-right:6px; animation:pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity:.35; } }

  /* top bar */
  .main { min-width:0; }
  .topbar { background:rgba(255,255,255,.86); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:14px 28px; display:flex; align-items:center; gap:18px; flex-wrap:wrap; position:sticky; top:0; z-index:5; }
  .topbar .ttl { flex:1; min-width:200px; }
  .topbar h2 { margin:0; font-size:20px; color:var(--ink); }
  .topbar p { margin:2px 0 0; color:var(--muted); font-size:13px; }
  .chips { display:flex; gap:8px; align-items:center; }
  .av { width:36px; height:36px; border-radius:50%; border:0; color:#fff; font-weight:700; font-size:12px; cursor:pointer; opacity:.5; transition:all .15s; }
  .av:hover { opacity:.85; transform:translateY(-1px); }
  .av.on { opacity:1; box-shadow:0 0 0 3px #fff,0 0 0 5px currentColor; }
  select { padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; font-size:13px; color:var(--text); }
  .switch { display:flex; align-items:center; gap:10px; cursor:pointer; user-select:none; font-weight:600; font-size:13px; }
  .switch .lab { color:var(--muted); transition:color .2s; }
  body:not(.post) .switch .l-pre, body.post .switch .l-post { color:var(--accent); }
  .track { width:54px; height:28px; border-radius:20px; background:var(--red); position:relative; transition:background .3s; }
  body.post .track { background:var(--green); }
  .thumb { position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; transition:transform .3s; box-shadow:0 1px 3px rgba(0,0,0,.3); }
  body.post .thumb { transform:translateX(26px); }
  .bar-state { height:4px; background:var(--accent); transition:background .4s; }

  /* content */
  #content { max-width:1120px; margin:0 auto; padding:26px 28px 60px; animation:fade .3s; }
  @keyframes fade { from { opacity:0; transform:translateY(6px); } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; margin-bottom:18px; box-shadow:0 1px 2px rgba(16,24,40,.04); }
  .card h3 { margin:0 0 4px; font-size:16px; color:var(--ink); }
  .sub { color:var(--muted); font-size:13px; margin:0 0 14px; }
  .grid { display:grid; gap:16px; }
  .g4 { grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); }
  .g3 { grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); }
  .g2 { grid-template-columns:repeat(auto-fit,minmax(380px,1fr)); }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  .btn { background:var(--blue); color:#fff; border:0; border-radius:10px; padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer; transition:all .15s; }
  .btn:hover { filter:brightness(1.08); transform:translateY(-1px); }
  .btn.alt { background:#fff; color:var(--blue); border:1px solid #bcd3f7; }
  .btn.red { background:var(--red); } .btn.green { background:var(--green); }
  .btn:disabled { opacity:.4; cursor:not-allowed; transform:none; }
  input[type=text], input[type=search] { padding:8px 12px; border:1px solid var(--line); border-radius:10px; font-size:13px; min-width:220px; }
  .chip { border:1px solid var(--line); background:#fff; border-radius:20px; padding:5px 14px; font-size:12px; cursor:pointer; color:var(--muted); transition:all .15s; }
  .chip.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .tag { display:inline-block; padding:2px 9px; border-radius:12px; font-size:11px; font-weight:700; }
  .tag.bad { background:#fde8e6; color:var(--red); } .tag.good { background:#def3e6; color:var(--green); } .tag.warn { background:#fdf0d5; color:var(--amber); } .tag.info { background:#e3edfd; color:var(--blue); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:10px 10px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em; font-weight:700; }
  tbody tr:hover td { background:#f8fafc; }
  tr.leak td { background:#fdf1f0; } tr.leak td.name { color:var(--red); font-weight:600; }
  .denied { color:var(--red); font-weight:700; }
  .empty { text-align:center; padding:36px 20px; color:var(--red); background:#fdf3f2; border:1px dashed #f1b8b2; border-radius:14px; }
  .empty b { display:block; font-size:16px; margin-bottom:6px; }

  /* dashboard */
  .hero { display:flex; align-items:center; gap:24px; background:linear-gradient(120deg,var(--ink),var(--ink2)); color:#fff; border-radius:18px; padding:24px 28px; margin-bottom:18px; flex-wrap:wrap; }
  .ring { width:104px; height:104px; border-radius:50%; display:grid; place-items:center; background:conic-gradient(var(--accent) 0%,rgba(255,255,255,.12) 0); flex:none; }
  .ring span { width:80px; height:80px; border-radius:50%; background:var(--ink); display:grid; place-items:center; font-size:24px; font-weight:800; }
  .hero h1 { margin:0 0 6px; font-size:24px; } .hero p { margin:0; color:#b6c4d8; max-width:560px; }
  .oc { background:#fff; border:1px solid var(--line); border-top:5px solid var(--accent); border-radius:16px; padding:18px; transition:transform .15s,box-shadow .15s; }
  .oc:hover { transform:translateY(-3px); box-shadow:0 10px 24px rgba(16,24,40,.1); }
  .oc-h { display:flex; justify-content:space-between; align-items:center; font-weight:800; color:var(--ink); font-size:15px; }
  .oc-h em { font-style:normal; font-size:11px; padding:2px 10px; border-radius:12px; background:var(--accent-soft); color:var(--accent); }
  .oc .big { font-size:42px; font-weight:800; margin:10px 0 0; color:var(--accent); line-height:1; }
  .oc .cap { color:var(--muted); font-size:12px; margin:4px 0 10px; }
  .oc .line { font-size:12px; border-top:1px solid var(--line); padding-top:10px; color:var(--text); }
  .feed div { display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px; animation:fade .4s; }
  .feed time { color:var(--muted); width:44px; flex:none; }
  .pulse { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--green); margin-right:6px; animation:pulse 1.2s infinite; }

  /* bars */
  .bar-row { display:grid; grid-template-columns:220px 1fr 56px; gap:12px; align-items:center; margin:9px 0; font-size:13px; }
  .bt { height:16px; background:#eef2f7; border-radius:10px; overflow:hidden; }
  .bf { height:100%; width:0; background:var(--green); border-radius:10px; transition:width .8s cubic-bezier(.2,.8,.2,1); }
  .bar-row.leak .bf { background:var(--red); } .bar-row.leak b { color:var(--red); }
  .bar-row.sup .bf { background:#cbd5e1; }
  .bv { text-align:right; color:var(--muted); font-weight:600; }
  .kpi { background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
  .kpi b { display:block; font-size:28px; color:var(--ink); } .kpi span { color:var(--muted); font-size:12px; }

  /* access */
  .pill { border:0; border-radius:20px; padding:4px 16px; font-weight:700; font-size:12px; cursor:pointer; transition:all .15s; }
  .pill.y { background:#def3e6; color:var(--green); } .pill.n { background:#eef1f5; color:#94a3b8; }
  .pill:hover { transform:scale(1.08); }
  .matrix td,.matrix th { text-align:center; } .matrix td:first-child,.matrix th:first-child { text-align:left; }
  .q { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .prog { height:8px; background:#eef2f7; border-radius:6px; overflow:hidden; margin:8px 0; }
  .prog div { height:100%; background:var(--amber); width:0; animation:grow 4s linear forwards; }
  @keyframes grow { to { width:100%; } }

  /* vault */
  .studio-card { border:1px solid var(--line); border-radius:16px; background:#fff; overflow:hidden; }
  .studio-card.rival { border-color:#f1b8b2; }
  .sc-h { display:flex; align-items:center; gap:10px; padding:14px 16px; color:#fff; font-weight:700; }
  .sc-h small { margin-left:auto; background:rgba(255,255,255,.25); padding:2px 10px; border-radius:10px; font-size:11px; }
  .sc-b { padding:10px 16px 16px; }
  .asset { display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .asset .k { color:var(--muted); width:74px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; }
  .asset .btn { margin-left:auto; padding:4px 12px; font-size:12px; }

  /* staff console */
  .console { background:#1b2230; color:#d6dde9; border-radius:14px; overflow:hidden; margin-bottom:18px; }
  .console .wb { background:#121823; padding:10px 14px; display:flex; gap:6px; align-items:center; font-size:12px; color:#8ea0bb; }
  .console .wb i { width:10px; height:10px; border-radius:50%; background:#ef4444; } .console .wb i:nth-child(2) { background:#f59e0b; } .console .wb i:nth-child(3) { background:#22c55e; }
  .console table { color:#d6dde9; } .console th { color:#8ea0bb; } .console td,.console th { border-color:#2a3446; } .console tbody tr:hover td { background:#222b3b; }
  .console .btn { padding:5px 12px; font-size:12px; }

  /* modal, overlay, toast */
  .modal-bg { position:fixed; inset:0; background:rgba(10,18,32,.55); display:none; place-items:center; z-index:50; padding:20px; }
  .modal-bg.show { display:grid; }
  .modal { background:#fff; border-radius:18px; max-width:520px; width:100%; padding:24px; animation:fade .2s; box-shadow:0 20px 60px rgba(0,0,0,.35); }
  .modal h3 { margin:0 0 10px; } .modal .alert { padding:10px 14px; border-radius:10px; margin-bottom:12px; font-weight:600; font-size:13px; }
  .alert.bad { background:#fde8e6; color:var(--red); } .alert.good { background:#def3e6; color:var(--green); }
  .overlay { position:fixed; inset:0; background:rgba(10,18,32,.85); display:none; place-items:center; z-index:60; }
  .overlay.show { display:grid; }
  .dbox { background:#fff; border-radius:18px; padding:28px 32px; width:min(460px,92vw); }
  .dbox h3 { margin:0 0 14px; } .dbox li { list-style:none; padding:6px 0; opacity:.25; transition:opacity .3s; font-size:14px; }
  .dbox li.done { opacity:1; } .dbox li.done::before { content:"\2713 "; color:var(--green); font-weight:800; } .dbox ul { padding:0; margin:0 0 14px; }
  .dbar { height:8px; background:#eef2f7; border-radius:6px; overflow:hidden; } .dbar div { height:100%; width:0; background:var(--green); transition:width .4s; }
  .toast { position:fixed; bottom:22px; right:22px; background:var(--ink); color:#fff; padding:12px 18px; border-radius:12px; font-size:13px; opacity:0; transform:translateY(10px); transition:all .25s; pointer-events:none; z-index:70; max-width:340px; }
  .toast.show { opacity:1; transform:none; }

  /* tests + doc */
  .trow { padding:5px 0; font-size:13px; animation:fade .25s; } .trow.pass b { color:var(--green); } .trow.fail b { color:var(--red); }
  .doc { background:#fff; border:1px solid var(--line); box-shadow:0 6px 24px rgba(0,0,0,.12); max-width:780px; margin:16px auto 0; padding:44px 52px; font-family:Georgia,"Times New Roman",serif; line-height:1.55; }
  .doc .lh { display:flex; justify-content:space-between; border-bottom:3px solid var(--ink); padding-bottom:12px; margin-bottom:18px; }
  .doc .lg { font-family:Inter,-apple-system,sans-serif; font-weight:800; font-size:20px; color:var(--ink); } .doc .lg small { display:block; font-weight:500; font-size:11px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; }
  .doc .meta { text-align:right; font-size:12px; color:var(--muted); }
  .doc h2 { font-family:Inter,-apple-system,sans-serif; font-size:22px; margin:0 0 4px; color:var(--ink); }
  .doc h4 { font-family:Inter,-apple-system,sans-serif; font-size:12px; text-transform:uppercase; letter-spacing:.07em; color:var(--blue); margin:20px 0 6px; border-bottom:1px solid var(--line); padding-bottom:3px; }
  .doc td:first-child { width:36%; color:var(--muted); } .doc tbody tr:hover td { background:none; }
  .doc .stamp { display:inline-block; border:2px solid var(--green); color:var(--green); font-family:Inter,sans-serif; font-weight:800; letter-spacing:.1em; padding:3px 12px; border-radius:4px; transform:rotate(-3deg); font-size:13px; }
  .doc .sign { display:flex; justify-content:space-between; margin-top:32px; font-size:12px; } .doc .sign div { width:44%; border-top:1px solid var(--text); padding-top:4px; }
  .doc .foot { margin-top:28px; padding-top:8px; border-top:1px solid var(--line); font-size:11px; color:var(--muted); text-align:center; }
  input[type=range] { accent-color:var(--blue); }
  @media print { body * { visibility:hidden; } .doc,.doc * { visibility:visible; } .doc { position:absolute; left:0; top:0; box-shadow:none; border:0; max-width:none; } }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><div>Vault<small>Partner platform</small></div></div>
    <nav id="nav"></nav>
    <div class="grow"></div>
    <div class="status-pill"><b><i></i><span id="sideStatus"></span></b><span id="sideSub"></span></div>

  <div class="main">

      <div class="ttl"><h2 id="pgTitle"></h2><p id="pgSub"></p></div>

      <select id="role"><option>Studio admin</option><option>Analyst</option><option>Operator</option></select>

    <div id="content"></div>
  </div>
</div>

<div class="modal-bg" id="modal"><div class="modal" id="modalBox"></div></div>
<div class="overlay" id="deploy"><div class="dbox"><h3>Applying vault controls</h3><ul id="dsteps"></ul><div class="dbar"><div id="dfill"></div></div></div></div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const hhmm = () => new Date().toTimeString().slice(0, 5);
const toast = m => { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2400); };

const IC = {
  dash:'<path d="M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z"/>',
  report:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8"/>',
  audit:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  access:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  vault:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  staff:'<path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M17 11l2 2 4-4"/>',
  bench:'<path d="M18 20V10M12 20V4M6 20v-6"/>',
  proof:'<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/>'
};
const VIEWS = [
  ["dash","Overview","Contain, Isolate, Prove, Harden at a glance"],
  ["report","Shared report","Contain: no competitor names in any report"],
  ["audit","Audit log","Prove: every access and change, exportable"],
  ["access","Roles and access","Isolate: studio-scoped, least privilege"],
  ["vault","IP vault","Isolate: games, data and math models"],
  ["staff","Staff console","Curveball 1: internal tool and math files"],
  ["bench","Operator benchmarks","Curveball 2: aggregates, never individual studios"],
  ["proof","Proof and audit report","Harden and Prove: tests and the document we send"]
];

const studios = [
  { id:"nova", name:"Nova Games", ini:"NG", color:"#6366f1", games:[
      {n:"Nova Spins",type:"Slots",theme:"Space",vol:"High",idx:112,rev:412}, {n:"Galaxy Reels",type:"Slots",theme:"Space",vol:"Medium",idx:104,rev:388}],
    models:[{n:"NOVA-RTP-96.1",rtp:"96.1%",vol:"High",hit:"27.4%",cfg:"5x3, 20 lines"},{n:"NOVA-VOL-HIGH",rtp:"95.8%",vol:"High",hit:"22.1%",cfg:"6x4, cluster pays"}] },
  { id:"aztec", name:"Aztec Studios", ini:"AZ", color:"#d97706", games:[
      {n:"Gold of Tenoch",type:"Slots",theme:"Adventure",vol:"High",idx:98,rev:301}, {n:"Jaguar Jackpot",type:"Slots",theme:"Adventure",vol:"High",idx:121,rev:276}],
    models:[{n:"AZT-RTP-95.8",rtp:"95.8%",vol:"High",hit:"24.9%",cfg:"5x4, 40 lines"}] },
  { id:"pixel", name:"PixelForge", ini:"PF", color:"#0d9488", games:[
      {n:"Fruit Fusion",type:"Slots",theme:"Fruit",vol:"Low",idx:91,rev:255}, {n:"Pixel Pirates",type:"Slots",theme:"Adventure",vol:"Medium",idx:87,rev:240}],
    models:[{n:"PXF-RTP-96.5",rtp:"96.5%",vol:"Medium",hit:"31.0%",cfg:"5x3, 25 lines"},{n:"PXF-HIT-FREQ",rtp:"96.0%",vol:"Low",hit:"38.6%",cfg:"3x3, 5 lines"}] },
  { id:"royal", name:"Royal Flush Labs", ini:"RF", color:"#be123c", games:[
      {n:"Crown Poker",type:"Table",theme:"Cards",vol:"Medium",idx:76,rev:198}, {n:"Royal 21",type:"Table",theme:"Cards",vol:"Low",idx:82,rev:210}],
    models:[{n:"RFL-RTP-97.0",rtp:"97.0%",vol:"Low",hit:"48.2%",cfg:"Blackjack, 6 decks"}] }
];
const byId = id => studios.find(s => s.id === id);

let me = studios[0], secure = false, view = "dash";
const role = () => $("#role").value;
const roles = ["Studio admin","Analyst","Operator"];
const caps = ["View own reports","Export own data","Open math models","Manage studio users"];
const perm = { "Studio admin":[1,1,1,1], "Analyst":[1,1,0,0], "Operator":[1,0,0,0] };
let log = [
  { t:"09:02", u:"a.khan", a:"Viewed report", x:"Revenue summary", s:"nova", r:"Allowed" },
  { t:"09:14", u:"m.silva", a:"Exported data", x:"Player metrics", s:"aztec", r:"Allowed" },
  { t:"09:31", u:"j.lee", a:"Opened math model", x:"PXF-RTP-96.5", s:"pixel", r:"Allowed" },
  { t:"09:47", u:"op.team", a:"Tried to view", x:"Aztec Studios revenue", s:"nova", r:"Denied" },
  { t:"10:05", u:"admin.ops", a:"Role changed", x:"Analyst: export removed", s:"royal", r:"Logged" },
  { t:"10:22", u:"a.khan", a:"Viewed report", x:"Game performance", s:"nova", r:"Allowed" }

/* ---------- rendering ---------- */
function animate() {
  requestAnimationFrame(() => $$("[data-w]").forEach(e => e.style.width = e.dataset.w + "%"));
  $$("[data-count]").forEach(e => {
    const to = +e.dataset.count, t0 = performance.now();
    const f = t => { const k = Math.min(1, (t - t0) / 800); e.textContent = Math.round(to * k).toLocaleString(); if (k < 1) requestAnimationFrame(f); };
    requestAnimationFrame(f);
  });
  const ring = $("#ring");
  if (ring) {
    const to = +ring.dataset.ring, t0 = performance.now();
    const f = t => { const k = Math.min(1, (t - t0) / 900), v = Math.round(to * k); ring.style.background = `conic-gradient(var(--accent) ${v}%, rgba(255,255,255,.12) 0)`; $("#ringTxt").textContent = v + "%"; if (k < 1) requestAnimationFrame(f); };
    requestAnimationFrame(f);
  }
}

};
document.addEventListener("click", e => {
  if (e.target.id === "modal") return A.close();
  const a = e.target.closest("[data-act]"); if (a && A[a.dataset.act]) A[a.dataset.act](a);
});
document.addEventListener("input", e => {
  if (e.target.id === "auditQ") { auditQ = e.target.value; $("#auditBody").innerHTML = auditRows(); }
  if (e.target.id === "kSlide") { bmK = +e.target.value; $("#kLabel").textContent = bmK; $("#bmBody").innerHTML = benchBody(); animate(); }
});

function modal(html) { $("#modalBox").innerHTML = html + `<div style="text-align:right;margin-top:14px"><button class="btn alt" data-act="close">Close</button></div>`; $("#modal").classList.add("show"); }
function openModel(sid, mi) {
  const s = byId(sid), m = s.models[mi], mine = sid === me.id;
  if (!secure) return modal(`<h3>${m.n}</h3>${mine ? "" : `<div class="alert bad">You opened ${s.name}'s math model. Nothing stops this and nothing records it.</div>`}${modelRow(m)}`);
  if (!mine) { addLog("Tried to open math model", `${s.name}: ${m.n}`, "Denied"); return modal(`<h3>Access denied</h3><div class="alert bad">You cannot open ${s.name}'s math models.</div><p>The attempt was recorded in the audit log.</p>`); }
  if (!perm[role()][2]) { addLog("Tried to open math model", m.n, "Denied"); return modal(`<h3>Access denied</h3><div class="alert bad">The ${role()} role cannot open math models.</div>`); }
  addLog("Opened math model", m.n, "Allowed");
  modal(`<h3>${m.n}</h3><div class="alert good">Your studio's model. Export is disabled and this view is logged.</div>${modelRow(m)}`);
}
function staffOpen(sid, mi) {
  const s = byId(sid), m = s.models[mi], g = grants.find(x => x.sid === sid && x.status === "active" && x.exp > Date.now());
  if (!secure) return modal(`<h3>${m.n}</h3><div class="alert bad">Staff opened ${s.name}'s math file. No ticket, no consent and no record.</div>${modelRow(m)}`);
  if (!g) { addLog("Staff tried to open math file", m.n, "Denied", sid, "support.staff"); return modal(`<h3>Locked</h3><div class="alert bad">No approved access for ${s.name}.</div><p>Request time-boxed access with a ticket. The studio approves and the attempt is logged.</p>`); }
  addLog("Staff opened math file", `${m.n} (${g.ticket})`, "Allowed", sid, "support.staff");
  modal(`<h3>${m.n}</h3><div class="alert good">Approved by ${s.name}, ticket ${g.ticket}. Expires automatically.</div>${modelRow(m)}`);
}
function runTests() {
  const id = ++testRun, out = $("#testOut"), bar = $("#tProg");
  const checks = [];
  studios.forEach(a => studios.forEach(b => { if (a.id !== b.id) checks.push(`${a.name} cannot read ${b.name} reports`); }));
  checks.push("Competitor names absent from shared reports", "Staff tools cannot read math models without a grant", "Every denied attempt is logged");
  out.innerHTML = ""; let i = 0;
  const step = () => {
    if (id !== testRun) return;
    bar.style.width = (i / checks.length * 100) + "%";
    if (i >= checks.length) { out.insertAdjacentHTML("beforeend", `<p><b style="color:${secure ? "var(--green)" : "var(--red)"}">${secure ? checks.length + "/" + checks.length + " passed" : "0/" + checks.length + " passed. Studios can reach each other's data."}</b></p>`); return; }
    out.insertAdjacentHTML("beforeend", `<div class="trow ${secure ? "pass" : "fail"}"><b>${secure ? "PASS" : "FAIL"}</b> ${checks[i++]}</div>`);
    setTimeout(step, 110);
  };
  step();
}

/* ---------- state switch ---------- */
$("#role").onchange = () => render();
$("#switch").onclick = () => {
  if (secure) { secure = false; render(); return; }
  const steps = ["Contain: filtering reports, locking the staff tool", "Isolate: applying studio-scoped roles", "Prove: switching on the audit log", "Harden: running isolation tests"];
  $("#dsteps").innerHTML = steps.map(s => `<li>${s}</li>`).join(""); $("#dfill").style.width = "0"; $("#deploy").classList.add("show");
  steps.forEach((_, i) => setTimeout(() => { $$("#dsteps li")[i].classList.add("done"); $("#dfill").style.width = ((i + 1) / steps.length * 100) + "%"; }, 450 * (i + 1)));
  setTimeout(() => { $("#deploy").classList.remove("show"); secure = true; render(); toast("Vault controls applied"); }, 450 * steps.length + 500);
};

/* ---------- timers ---------- */
function tick() {
  const now = Date.now();
  $$("[data-exp]").forEach(e => { const s = Math.max(0, Math.round((+e.dataset.exp - now) / 1000)); e.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; });
}
setInterval(() => {
  tick();
  if (view === "staff" && grants.some(g => g.status === "active" && g.exp && g.exp <= Date.now() && !g.done)) { grants.forEach(g => { if (g.exp && g.exp <= Date.now()) g.done = true; }); render(); }
}, 1000);
setInterval(() => {
  if (!secure) return;
  const users = ["a.khan", "m.silva", "j.lee", "k.owen", "r.diaz"], acts = [["Viewed report", "Revenue summary", "Allowed"], ["Exported data", "Player metrics", "Allowed"], ["Opened math model", "Own model", "Allowed"], ["Tried to view", "Another studio's data", "Denied"]];
  const a = acts[Math.floor(Math.random() * acts.length)], s = studios[Math.floor(Math.random() * studios.length)];
  const u = users[Math.floor(Math.random() * users.length)];
  feed.unshift({ t:hhmm(), u, a:a[0], x:a[1], r:a[2] }); feed = feed.slice(0, 7);
  log.push({ t:hhmm(), u, a:a[0], x:a[1], s:s.id, r:a[2] });
  if (view === "dash") $("#feed").innerHTML = feedHtml();
}, 2600);

render();
</script>
